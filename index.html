<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проста форма-анкета</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section>
        <div class="container">
          <h1>Проста форма-анкета</h1>
          <form>
            <fieldset>
              <legend>Заповність ваші дані</legend>
            <p>
              <label for="firstname">Ваше ім'я</label>
              <input
                id="firstname"
                name="firstname"
                type="text"
                title="This field is realy important"
                placeholder="Введіть своє ім'я:"
              />
            </p>
            <p>
              <label>
                <span>Ваше прізвище</span> 
                <input
                name="lastname"
                type="text"
                placeholder="Введіть своє прізвище:"
              
              />
              <label>
            </p>
            <p>
              <input 
              type="tel" 
              name="phone" 
              id="phone" 
              placeholder="Телефон:" />
            </p>
            <P>
              <input
              type="email"
               name="email" 
               id="email" 
               placeholder="email:"
               required>
               <P>
                </fieldset>
                <fieldset>
                  <legend>Дані про ваш курс</legend>
                  <p>
                    <label for="course">Оберіть ваш курс</label>
                    <select name="course" id="course">
                    <option value="selected disabled">Оберіть ваш курс</option>
                    <option value="frontend">Front-End розробка</option>
                    <option value="backend">Back-End розробка</option>
                    <option value="design">UI/UX Дизайн</option>
                    </select>
                  </p>
                <P>
                  Чи виконуєте ви домашнє завдання? <br>
                  <label>
                    <input type="radio" name="homework" value="yes"> 
                  Так, виконую></label> <br>
                  <input type="radio" name="homework" value="no"> 
                  Ні, не встигаю></label> <br>
                  
                </P>
            
                <P>
                  Додаткова інформація: <br>
                  <label>
                    <input type="checkbox" name="continue" value="yes"> Буду продовжувати навчання
                  </label> <br>
                  <label >
                    <input type="checkbox" name="english" value="yes"> Додатково вивчаю англійську мову
                  </label>
                  </p>
                  </fieldset>

                  <fieldset>
                   <textarea name="Comment" rows="3" placeholder="Comment"></textarea> 
                   </fieldset>

                   <button type="submit">Зберегти відповідь</button>
                   </form>
                   </body>
                 
</html>
